<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E6DCCB">
<title>Gaëtan & Sonia</title>
<style>
/* Plein cadre 9:16 centré, papier crème, encre bleu-noir, un accent or */
:root{
  --paper:#F4EDE0; --paper-deep:#E6DCCB; --ink:#1B2233; --ink-soft:rgba(27,34,51,.55); --gold:#B8902F;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper-deep);color:var(--ink);font-family:var(--serif);display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0}
#stage{position:relative;height:min(100vh,100vw*16/9);height:min(100dvh,100vw*16/9);aspect-ratio:9/16;max-width:100%;background:var(--paper);box-shadow:0 1px 0 rgba(27,34,51,.06),0 18px 50px -24px rgba(27,34,51,.35);overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
#film{position:absolute;inset:0;width:100%;height:100%;display:block}
#bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(27,34,51,.07)}
#bar i{display:block;height:100%;width:0;background:rgba(27,34,51,.32)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;text-align:center;background:var(--paper);transition:opacity 1.2s ease}
.overlay.fade{opacity:0;pointer-events:none}
.overlay h1{font-weight:400;font-style:italic;font-size:clamp(1.7rem,6.5cqh,2.4rem);margin:0;letter-spacing:.01em;text-wrap:balance}
.overlay .rule{width:3.2rem;height:2px;background:var(--ink);opacity:.75;border-radius:2px}
.overlay p{margin:0;font-style:italic;font-size:.95rem;color:var(--ink-soft)}
#stage{container-type:size}
button.play{font:italic 1.15rem var(--serif);color:var(--ink);background:transparent;border:1px solid rgba(27,34,51,.55);border-radius:999px;padding:.6rem 1.9rem;cursor:pointer;margin-top:.6rem;transition:background .3s,color .3s}
button.play:hover,button.play:focus-visible{background:var(--ink);color:var(--paper);outline:none}
button.play:focus-visible{box-shadow:0 0 0 3px rgba(184,144,47,.55)}
#pause{position:absolute;top:14px;right:16px;font-style:italic;font-size:.85rem;color:var(--ink-soft);opacity:0;transition:opacity .4s;pointer-events:none}
#pause.on{opacity:1}
#replay{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity 1.2s}
#replay.on{opacity:1;pointer-events:auto}
@media (max-width:600px){body{background:var(--paper)}#stage{box-shadow:none}}
</style>
</head>
<body>

<div id="stage" aria-label="Film d'animation : souvenirs de Gaëtan et Sonia">
  <canvas id="film"></canvas>
  <div id="bar"><i></i></div>
  <div id="pause">En pause · touchez pour reprendre</div>
  <button class="play" id="replay" type="button">Revoir</button>
  <div class="overlay" id="intro">
    <h1>Gaëtan &amp; Sonia</h1>
    <div class="rule"></div>
    <p>Onze souvenirs · 2 min 10</p>
    <button class="play" id="play" type="button">Lecture</button>
    <p style="font-size:.8rem;opacity:.8">Avec le son, volume bas</p>
  </div>
</div>

<script>
'use strict';
/* ============ constantes & outils ============ */
const W=540,H=960,TOTAL=130;
const SERIF='"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif';
const INK='27,34,51',GOLD='184,144,47',SKIN='247,241,231',WHITE='252,249,243',PAPERC='244,237,224';
const rgba=(c,a)=>`rgba(${c},${a})`;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t*t*(3-2*t);};
const easeIO=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const easeOut=t=>1-Math.pow(1-clamp(t),3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const PI=Math.PI;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const vn=x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return hash(i)*(1-u)+hash(i+1)*u;};
const ell=(x,y,rx,ry,n=18,r0=0)=>Array.from({length:n},(_,i)=>{const a=i/n*PI*2+r0;return[x+Math.cos(a)*rx,y+Math.sin(a)*ry];});

function spline(p,n){
  if(p.length<3){const o=[],a=p[0],b=p[1],k=n*2;for(let i=0;i<=k;i++){const t=i/k;o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}return o;}
  const o=[];
  for(let i=0;i<p.length-1;i++){
    const p0=p[Math.max(i-1,0)],p1=p[i],p2=p[i+1],p3=p[Math.min(i+2,p.length-1)];
    for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;
      o.push([.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
              .5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]);}
  }
  o.push(p[p.length-1]);return o;
}
/* trait de pinceau : largeur variable, attaque et fin effilées, grain sec */
function brush(c,pts,w,o={}){
  const col=o.col||INK,a=o.a===undefined?.85:o.a,seed=o.seed||1,p=o.p===undefined?1:o.p;
  let sp=spline(pts,o.n||6);const N=sp.length;let n=N;
  if(p<1){n=Math.max(2,Math.ceil(N*p));sp=sp.slice(0,n);}
  if(p<=0||n<2)return null;
  const ts=o.ts===undefined?.3:o.ts,te=o.te===undefined?.12:o.te,ls=o.ls===undefined?.18:o.ls,le=o.le===undefined?.3:o.le,jit=o.j===undefined?.22:o.j;
  const L=[],R=[];
  for(let i=0;i<n;i++){
    const u=i/(N-1),ue=(n-1-i)/(N-1);
    const a0=sp[Math.max(i-1,0)],a1=sp[Math.min(i+1,n-1)];
    let dx=a1[0]-a0[0],dy=a1[1]-a0[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
    let f=1;if(u<ls)f*=lerp(ts,1,Math.sqrt(u/ls));if(ue<le)f*=lerp(te,1,Math.sqrt(ue/le));
    f*=1+(vn(u*7+seed*3.7)-.5)*2*jit;
    const hw=w*f/2;
    L.push([sp[i][0]-dy*hw,sp[i][1]+dx*hw]);R.push([sp[i][0]+dy*hw,sp[i][1]-dx*hw]);
  }
  c.fillStyle=rgba(col,a);c.beginPath();c.moveTo(L[0][0],L[0][1]);
  for(let i=1;i<n;i++)c.lineTo(L[i][0],L[i][1]);
  for(let i=n-1;i>=0;i--)c.lineTo(R[i][0],R[i][1]);
  c.closePath();c.fill();
  if(o.dry&&w>3.5){
    c.strokeStyle=rgba(PAPERC,.4);c.lineWidth=Math.max(.5,w*.07);
    for(let k=0;k<2;k++){const off=(hash(seed+k*7)-.5)*.7;c.beginPath();let on=false;
      for(let i=Math.floor(n*.35);i<n;i++){const q=[lerp(L[i][0],R[i][0],.5+off),lerp(L[i][1],R[i][1],.5+off)];
        if(vn(i*.35+seed+k*13)>.55){on?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]);on=true;}else on=false;}
      c.stroke();}
  }
  return{L,R,sp};
}
function line(c,pts,lw,a,o={}){
  const sp=(o.raw||pts.length<3)?pts:spline(pts,o.n||6);
  const n=o.p!==undefined?Math.max(2,Math.ceil(sp.length*o.p)):sp.length;
  c.strokeStyle=rgba(o.col||INK,a);c.lineWidth=lw;c.lineCap='round';c.lineJoin='round';
  c.beginPath();c.moveTo(sp[0][0],sp[0][1]);for(let i=1;i<n;i++)c.lineTo(sp[i][0],sp[i][1]);c.stroke();
}
function shape(c,pts,col,a,o={}){
  const seed=o.seed||1,amp=o.amp===undefined?1:o.amp,n=pts.length;
  const q=amp?pts.map((p,i)=>[p[0]+(vn(i*1.7+seed)-.5)*2*amp,p[1]+(vn(i*2.3+seed+5)-.5)*2*amp]):pts;
  c.beginPath();
  if(o.sharp){c.moveTo(q[0][0],q[0][1]);for(let i=1;i<n;i++)c.lineTo(q[i][0],q[i][1]);c.closePath();}
  else{c.moveTo((q[n-1][0]+q[0][0])/2,(q[n-1][1]+q[0][1])/2);
    for(let i=0;i<n;i++){const p=q[i],nx=q[(i+1)%n];c.quadraticCurveTo(p[0],p[1],(p[0]+nx[0])/2,(p[1]+nx[1])/2);}c.closePath();}
  if(a>0){c.fillStyle=rgba(col,a);c.fill();}
  if(o.edge){c.strokeStyle=rgba(o.ecol||INK,o.edge);c.lineWidth=o.lw||1.2;c.lineJoin='round';c.stroke();}
}
function blob(c,x,y,rx,ry,col,a,seed,o={}){
  const n=14,p=[];for(let i=0;i<n;i++){const an=i/n*PI*2,f=1+(vn(i*.9+seed*1.3)-.5)*.5;p.push([x+Math.cos(an)*rx*f,y+Math.sin(an)*ry*f]);}
  shape(c,p,col,a,{seed,amp:0,edge:o.edge,lw:o.lw});
}
function glow(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,PI*2);c.fill();}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function limb(c,p,w,col,a,seed,ol){const r=brush(c,p,w,{col,a,seed,ts:.95,te:.85,ls:.1,le:.15,j:.07,n:5});if(ol&&r){line(c,r.L,ol,.7,{raw:true});line(c,r.R,ol,.7,{raw:true});}}
function fk(o,a,l1,l2){const k=[o[0]+l1*Math.sin(a[0]),o[1]+l1*Math.cos(a[0])];return[o,k,[k[0]+l2*Math.sin(a[0]+a[1]),k[1]+l2*Math.cos(a[0]+a[1])]];}
function ik(o,t,l1,l2,b){let dx=t[0]-o[0],dy=t[1]-o[1],d=Math.hypot(dx,dy);const m=(l1+l2)*.995;if(d>m){dx*=m/d;dy*=m/d;d=m;}d=Math.max(d,1e-3);
  const A=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1)),g=Math.atan2(dy,dx)+b*A;return[o,[o[0]+l1*Math.cos(g),o[1]+l1*Math.sin(g)],[o[0]+dx,o[1]+dy]];}
const lerpP=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
function arcPts(r,a0,a1,rad,sd,n=14,bump=.06,wf=.96){const o=[];for(let i=0;i<=n;i++){const a=PI*(a0+(a1-a0)*i/n),b=rad+bump*(vn(i*1.3+sd)-.5)*2;o.push([Math.cos(a)*r*b*wf,Math.sin(a)*r*b]);}return o;}
function dot(c,x,y,r,col,a){c.fillStyle=rgba(col,a);c.beginPath();c.arc(x,y,r,0,PI*2);c.fill();}

/* ============ personnages ============ */
const FIG={G:{H:262,sh:.108,hip:.064,hr:.064,leg:.08,arm:.056,waist:.95},S:{H:230,sh:.095,hip:.078,hr:.071,leg:.075,arm:.05,waist:.8}};
function walkPose(ph,dir,amp=.3){
  const b1=.5*Math.max(0,Math.sin(ph+1.3)),b2=.5*Math.max(0,Math.sin(ph+1.3+PI));
  return{lLeg:[dir*Math.sin(ph)*amp,-dir*b1],rLeg:[-dir*Math.sin(ph)*amp,-dir*b2],
    lArm:[-dir*Math.sin(ph)*amp*.55-.06,.12],rArm:[dir*Math.sin(ph)*amp*.55+.06,-.12],bob:-Math.abs(Math.cos(ph))*4};
}
function eyes(c,r,fx,fd,P){
  const sp=.3*r*(1-.35*Math.abs(fd)),ey=-.02*r+(P.ly||0)*r;
  for(const sg of[-1,1]){const ex=fx+sg*sp;
    if(P.closed)line(c,[[ex-.1*r,ey],[ex,ey+.05*r],[ex+.1*r,ey]],Math.max(.6,.06*r),.85);
    else dot(c,ex,ey,Math.max(.9,.068*r),INK,.9);}
  if(P.smile)line(c,[[fx-.15*r,.47*r],[fx,.53*r],[fx+.15*r,.47*r]],Math.max(.6,.055*r),.7);
}
function sunglasses(c,r,sd){brush(c,[[-.8*r,-.72*r],[0,-.82*r],[.8*r,-.72*r]],.08*r,{a:.85,seed:sd+44,j:.05});
  for(const sg of[-1,1])shape(c,ell(sg*.34*r,-.8*r,.26*r,.13*r,10),INK,.82,{amp:0});}
function headG(c,r,P,sd,lw){
  const fd=P.face||0,fx=fd*r*.33;
  if(P.back){
    for(const sg of[-1,1])shape(c,ell(sg*.9*r,.1*r,.13*r,.2*r,8),SKIN,1,{edge:.6,lw:lw*.7,seed:sd+40+sg,amp:0});
    shape(c,ell(0,0,.9*r,r,18),SKIN,1,{seed:sd+41,amp:r*.02,edge:.7,lw});
    const hp=arcPts(r,.93,2.07,1.07,sd);hp.push([.84*r,.34*r],[0,.48*r],[-.84*r,.34*r]);
    shape(c,hp,INK,.64,{seed:sd+43,amp:r*.03});
    for(let i=0;i<5;i++){const u=-.5+i*.25;brush(c,[[u*r,-.9*r],[u*r+.1*r,-1.16*r-hash(i+sd)*.08*r]],.13*r,{a:.62,seed:sd+50+i});}
    if(P.glasses)brush(c,[[-.9*r,-.66*r],[0,-.82*r],[.9*r,-.66*r]],.08*r,{a:.85,seed:sd+44});
    return;
  }
  for(const sg of[-1,1])if(sg*fd<.35)shape(c,ell(sg*.9*r+fx*.15,.08*r,.14*r,.2*r,8),SKIN,1,{edge:.6,lw:lw*.7,seed:sd+40+sg,amp:0});
  shape(c,ell(0,0,.9*r,r,20),SKIN,1,{seed:sd+41,amp:r*.02,edge:.72,lw});
  const bd=[];for(let i=0;i<=12;i++){const a=PI*(.1+.8*i/12);bd.push([Math.cos(a)*.9*r,Math.sin(a)*r]);}
  bd.push([-.62*r+fx,.26*r],[fx,.38*r],[.62*r+fx,.26*r]);
  shape(c,bd,INK,.24,{seed:sd+42,amp:r*.02});
  for(let i=0;i<10;i++){const a=PI*(.18+.64*hash(i*3+sd)),rd=.72+.2*hash(i*5+sd);dot(c,Math.cos(a)*.9*r*rd,Math.sin(a)*r*rd,Math.max(.4,.03*r),INK,.35);}
  const hp=arcPts(r,1.04,1.96,1.08,sd);hp.push([.86*r,-.28*r],[.45*r+fx*.6,-.5*r],[-.1*r+fx*.6,-.6*r],[-.6*r,-.5*r],[-.87*r,-.28*r]);
  shape(c,hp,INK,.62,{seed:sd+43,amp:r*.03});
  for(let i=0;i<5;i++){const u=-.5+i*.25;brush(c,[[u*r,-.88*r],[u*r+.12*r,-1.17*r-hash(i+sd)*.08*r]],.13*r,{a:.66,seed:sd+50+i});}
  if(P.glasses)sunglasses(c,r,sd);
  eyes(c,r,fx,fd,P);
}
function headS(c,r,P,sd,lw,hair){
  const fd=P.face||0,fx=fd*r*.33;
  if(P.back){
    if(hair==='short')for(const sg of[-1,1])shape(c,ell(sg*.92*r,.1*r,.13*r,.2*r,8),SKIN,1,{edge:.6,lw:lw*.7,seed:sd+40+sg,amp:0});
    shape(c,ell(0,0,.92*r,.98*r,18),SKIN,1,{seed:sd+41,amp:r*.02,edge:.7,lw});
    let hp;
    if(hair==='mid'){hp=arcPts(r,.85,2.15,1.08,sd);hp.push([1.02*r,1.2*r],[.55*r,1.55*r],[-.55*r,1.55*r],[-1.02*r,1.2*r]);}
    else{hp=arcPts(r,.9,2.1,1.1,sd);hp.push([.8*r,.5*r],[0,.64*r],[-.8*r,.5*r]);}
    shape(c,hp,INK,.8,{seed:sd+43,amp:r*.03});
    if(P.glasses)brush(c,[[-.9*r,-.66*r],[0,-.84*r],[.9*r,-.66*r]],.08*r,{a:.85,seed:sd+44});
    return;
  }
  if(hair==='short')for(const sg of[-1,1])if(sg*fd<.35){shape(c,ell(sg*.92*r+fx*.15,.1*r,.13*r,.2*r,8),SKIN,1,{edge:.6,lw:lw*.7,seed:sd+40+sg,amp:0});dot(c,sg*.93*r+fx*.15,.3*r,Math.max(.7,.055*r),INK,.9);}
  shape(c,ell(0,0,.92*r,.98*r,20),SKIN,1,{seed:sd+41,amp:r*.02,edge:.72,lw});
  if(hair==='mid'){
    const hp=arcPts(r,1.0,2.0,1.08,sd);hp.push([.97*r,.1*r],[.62*r,-.36*r],[.15*r+fx*.5,-.5*r],[-.3*r,-.74*r],[-.72*r,-.44*r],[-.97*r,.1*r]);
    shape(c,hp,INK,.8,{seed:sd+43,amp:r*.03});
    brush(c,[[-.9*r,-.2*r],[-1.0*r,.45*r],[-.9*r,1.05*r]],.3*r,{a:.8,seed:sd+45,ts:.8,te:.3});
    brush(c,[[.9*r,-.2*r],[1.0*r,.45*r],[.9*r,1.05*r]],.3*r,{a:.8,seed:sd+46,ts:.8,te:.3});
  }else{
    const hp=arcPts(r,.98,2.02,1.12,sd,14,.08);hp.push([.95*r,-.02*r],[.8*r,-.28*r],[.35*r+fx*.4,-.42*r],[-.1*r,-.55*r],[-.45*r,-.72*r],[-.82*r,-.42*r],[-.95*r,-.02*r]);
    shape(c,hp,INK,.8,{seed:sd+43,amp:r*.03});
    for(const sg of[-1,1])brush(c,[[sg*.9*r,-.25*r],[sg*.92*r,.12*r]],.12*r,{a:.75,seed:sd+47+sg});
  }
  if(P.glasses)sunglasses(c,r,sd);
  eyes(c,r,fx,fd,P);
}
function figure(c,who,P){
  const F=FIG[who],s=P.s||1,h=F.H*s,x=P.x,y=P.y+(P.bob||0)*s,back=!!P.back,fd=P.face||0,sd=(who==='G'?100:200)+(P.seed||0);
  const lean=P.lean||0,hipY=y-.49*h,cs=Math.cos(lean),sn=Math.sin(lean);
  const R=(ux,uy)=>{const dx=ux*h,dy=(y-uy*h)-hipY;return[x+dx*cs-dy*sn,hipY+dx*sn+dy*cs];};
  const top=P.top||(who==='G'?'hoodie':'knit'),hair=P.hair||'short',lw=Math.max(.7,1.25*s),hr=F.hr*h;
  const shL=R(-F.sh,.8),shR=R(F.sh,.8),head=R(P.hx||0,.915);
  const hipL=[x-F.hip*h*.7,hipY],hipR=[x+F.hip*h*.7,hipY];
  const L1=.255*h,L2=.245*h,A1=.185*h,A2=.175*h;
  const lL=fk(hipL,P.lLeg||[-.05,.02],L1,L2),rL=fk(hipR,P.rLeg||[.05,-.02],L1,L2);
  const arm=(o,a,d,b)=>a&&a.t?ik(o,a.t,A1,A2,a.b!==undefined?a.b:b):fk(o,a||d,A1,A2);
  const lA=arm(shL,P.lArm,[-.1,.1],1),rA=arm(shR,P.rArm,[.1,-.1],-1);
  const HT=fn=>{c.save();c.translate(head[0],head[1]);c.rotate((P.tilt||0)+lean*.5);fn(hr);c.restore();};
  if(who==='S'&&hair==='mid'&&!back)HT(r=>shape(c,[[-1.0*r,-.4*r],[-1.16*r,.5*r],[-1.1*r,1.3*r],[-.7*r,1.58*r],[.7*r,1.58*r],[1.1*r,1.3*r],[1.16*r,.5*r],[1.0*r,-.4*r],[.6*r,-1.04*r],[-.6*r,-1.04*r]],INK,.8,{seed:sd+1,amp:r*.04}));
  // jambes
  for(const[L,k]of[[lL,1],[rL,2]]){

    caption(S,lt);return;

  drawFinal(t-115);
}

/* ============ son ============ */
let AC=null,OUT=null,REV=null,NOISE=null,BROWN=null,IR=null,T0=0,EV=[],ei=0;
function audioInit(){
  if(AC)return;
  try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
  const sr=AC.sampleRate;
  NOISE=AC.createBuffer(1,sr*3,sr);let d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  BROWN=AC.createBuffer(1,sr*3,sr);d=BROWN.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5;}
  IR=AC.createBuffer(2,sr*3.2,sr);for(let ch=0;ch<2;ch++){d=IR.getChannelData(ch);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.8);}
}
let chain=null;
function audioChain(){
  if(chain){const o=chain.out;o.gain.cancelScheduledValues(AC.currentTime);o.gain.setValueAtTime(o.gain.value,AC.currentTime);o.gain.linearRampToValueAtTime(0,AC.currentTime+.4);setTimeout(()=>{try{o.disconnect();}catch(e){}},600);}
  OUT=AC.createGain();OUT.gain.setValueAtTime(0,AC.currentTime);OUT.gain.linearRampToValueAtTime(.5,AC.currentTime+1.2);
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-22;comp.knee.value=18;comp.ratio.value=3;
  OUT.connect(comp);comp.connect(AC.destination);
  const conv=AC.createConvolver();conv.buffer=IR;REV=AC.createGain();REV.gain.value=.45;REV.connect(conv);conv.connect(OUT);
  chain={out:OUT};
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function filt(type,f,q=.7){const b=AC.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;return b;}
function toOut(node,rev=0){node.connect(OUT);if(rev){const r=AC.createGain();r.gain.value=rev;node.connect(r);r.connect(REV);}}
function env(g,w,a,att,hold,rel){g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(a,w+att);g.gain.setValueAtTime(a,w+att+Math.max(0,hold));g.gain.linearRampToValueAtTime(0,w+att+Math.max(0,hold)+rel);}
function nsrc(w,dur,buf){const s=AC.createBufferSource();s.buffer=buf||NOISE;s.loop=true;s.start(w,Math.random()*2);s.stop(w+dur+.05);return s;}
function bed(w,dur,o){
  const s=nsrc(w,dur,o.buf),b=filt(o.type||'lowpass',o.f||800,o.q||.7),g=AC.createGain(),att=o.att||1.5,rel=o.rel||1.5;
  env(g,w,o.vol||.03,att,dur-att-rel,rel);s.connect(b);
  if(o.lfo){const m=AC.createGain();m.gain.value=1-o.depth;const osc=AC.createOscillator();osc.frequency.value=o.lfo;const od=AC.createGain();od.gain.value=o.depth;osc.connect(od);od.connect(m.gain);osc.start(w);osc.stop(w+dur+.1);b.connect(m);m.connect(g);}
  else b.connect(g);
  toOut(g,o.rev||0);
}
function piano(w,m,vel,dur=3.6){
  const f=mf(m),g=AC.createGain();
  g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(vel,w+.007);g.gain.exponentialRampToValueAtTime(vel*.4,w+.35);g.gain.exponentialRampToValueAtTime(.0001,w+dur);
  const lp=filt('lowpass',Math.min(9000,f*7),.5);lp.frequency.setValueAtTime(Math.min(9000,f*7),w);lp.frequency.exponentialRampToValueAtTime(Math.max(400,f*1.6),w+dur*.7);
  for(const[k,a,ty,dt]of[[1,1,'triangle',0],[2,.28,'sine',2],[3,.1,'sine',-3],[5,.03,'sine',4]]){const o=AC.createOscillator();o.type=ty;o.frequency.value=f*k;o.detune.value=dt;const og=AC.createGain();og.gain.value=a;o.connect(og);og.connect(lp);o.start(w);o.stop(w+dur+.05);}
  lp.connect(g);toOut(g,.7);
}
function pad(w,ms,dur,vol=.02){
  const g=AC.createGain(),lp=filt('lowpass',620,.4);env(g,w,vol,2.2,dur-4.5,2.3);
  for(const m of ms)for(const dt of[-7,7]){const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=mf(m);o.detune.value=dt;const og=AC.createGain();og.gain.value=1/(ms.length*2);o.connect(og);og.connect(lp);o.start(w);o.stop(w+dur+.1);}
  lp.connect(g);toOut(g,.8);
}
function tone(w,f0,f1,dur,vol,type='sine',filter){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,w);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),w+dur);const g=AC.createGain();g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(vol,w+.005);g.gain.exponentialRampToValueAtTime(.0001,w+dur);
  o.connect(filter||g);if(filter)filter.connect(g);toOut(g,.3);o.start(w);o.stop(w+dur+.05);}
function burst(w,dur,type,f,q,vol,buf,rev=.2){const s=nsrc(w,dur,buf),b=filt(type,f,q),g=AC.createGain();g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(vol,w+.004);g.gain.exponentialRampToValueAtTime(.0001,w+dur);s.connect(b);b.connect(g);toOut(g,rev);}
const SFX={
  click:w=>burst(w,.018,'highpass',2600,.7,.05),
  thump:w=>{tone(w,90,40,.35,.12);burst(w,.2,'lowpass',200,.7,.08,BROWN);},
  jingle:w=>{for(let i=0;i<7;i++)tone(w+Math.random()*.4,3000+Math.random()*3500,2900+Math.random()*3000,.28,.012);},
  step:w=>burst(w,.08,'bandpass',900,1.1,.05),
  gravel:w=>{burst(w,.1,'bandpass',2600,.6,.03);burst(w+.03,.05,'bandpass',3800,.8,.02);},
  chirp:w=>{const f=2400+Math.random()*1800;for(let i=0;i<2+Math.floor(Math.random()*2);i++)tone(w+i*.11,f,f*1.35,.07,.012);},
  cricket:w=>{for(let i=0;i<3;i++)tone(w+i*.045,4700,4600,.03,.006);},
  frog:w=>{tone(w,2250,2300,.06,.009);tone(w+.08,3100,3350,.1,.009);},
  kick:w=>{const lp=filt('lowpass',900);tone(w,120,42,.32,.16,'sine',lp);},
  kickFar:w=>{const lp=filt('lowpass',260);tone(w,110,45,.3,.1,'sine',lp);},
  snare:w=>{burst(w,.16,'bandpass',1800,.8,.05,null,.3);tone(w,200,160,.08,.03,'triangle');},
  heart:w=>{const lp=filt('lowpass',120);tone(w,58,40,.2,.12,'sine',lp);const lp2=filt('lowpass',120);tone(w+.28,55,38,.18,.08,'sine',lp2);},
  cough:w=>{burst(w,.28,'lowpass',180,.8,.16,BROWN,.1);tone(w,48,30,.25,.05,'sawtooth',filt('lowpass',200));},
  gull:w=>{for(let i=0;i<2;i++){tone(w+i*.35,1500,950,.3,.008,'triangle',filt('bandpass',1200,2));}},
  drip:w=>tone(w,1800+Math.random()*900,700,.05,.01),
  tag:w=>tone(w,5200+Math.random()*1500,5000,.18,.008),
};
function buildEvents(){
  const E=[];const at=(t,f)=>E.push({t,f});
  // musique
  const CH={D:[[50,57,61,66],[74,76,78,81,85]],Bm:[[47,54,57,62],[71,73,74,78,81]],G:[[43,50,54,59],[67,71,74,78,79]],A:[[45,52,57,61],[69,71,73,76,78]],
    As:[[45,52,57,62],[69,71,74,76,81]],Fm:[[42,49,54,57],[69,73,76,78,81]],Em:[[40,47,50,55],[67,71,74,76,79]],DF:[[42,50,57,61],[74,76,78,81,85]],D9:[[38,50,57,61,64],[76,78,81,85,88]]};
  const SEQ=['D','D','Bm','G','As','D','Fm','G','A','Bm','G','D','G','Bm','Em','G','DF','Em','A','D','G','Bm','G','As','D9','D9'];
  SEQ.forEach((n,i)=>{const ch=CH[n];at(i*5,w=>pad(w,ch[0],i>=24?9:6.8,i===9||i===10?.012:.02));at(i*5+.02,w=>piano(w,ch[0][0]+12,.05,4.5));});
  const R=rng(42);let idx=2;
  for(let b=0;b<52;b++){const tb=b*2.5,slot=Math.floor(tb/5),ch=CH[SEQ[slot]],pool=ch[1];
    if(tb<2.5)continue;
    let dens=1;if(tb>=45&&tb<55)dens=.35;if(tb>=115)dens=.55;if(tb>=122.5)dens=0;
    for(const[bt,pr]of[[0,.92],[.833,.42],[1.667,.62],[2.08,.18]]){if(R()<pr*dens){idx=clamp(idx+Math.round((R()-.5)*3),0,pool.length-1);const m=pool[idx];at(tb+bt,w=>piano(w,m,.045+R()*.03));}}
  }
  at(1.2,w=>piano(w,78,.05));at(2.9,w=>piano(w,74,.045));
  at(123.4,w=>piano(w,81,.06,6));at(123.4,w=>piano(w,74,.04,6));at(125.1,w=>piano(w,78,.045,6));at(126.8,w=>piano(w,86,.035,7));
  const s0=i=>5+i*10;
  // 1 en ligne
  for(const[a,b]of[[.4,1],[1.1,1.6],[1.8,2.4],[2.45,2.9],[3.2,3.5]]){let x=a;while(x<b){at(s0(0)+x,SFX.click);x+=.08+R()*.1;}}
  at(s0(0)+4,w=>bed(w,6.2,{type:'bandpass',f:700,q:.6,vol:.03,att:2.5,rel:2}));
  at(s0(0)+4.8,w=>{const lp=filt('lowpass',320);const g=AC.createGain();env(g,w,.028,2,1.5,2.5);lp.connect(g);toOut(g,.6);for(const m of[40,47,52]){const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=mf(m);o.connect(lp);o.start(w);o.stop(w+6.2);}});
  // 2 panda
  at(s0(1),w=>{const lp=filt('lowpass',150);const g=AC.createGain();env(g,w,.05,.3,2.2,.35);const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(38,w);o.frequency.linearRampToValueAtTime(30,w+2.8);o.connect(lp);lp.connect(g);toOut(g,.1);o.start(w);o.stop(w+3);});
  at(s0(1),w=>bed(w,2.9,{buf:BROWN,f:160,vol:.05,att:.3,rel:.4}));
  for(const x of[1.35,2.0,2.55])at(s0(1)+x,SFX.cough);
  at(s0(1)+3.3,SFX.thump);at(s0(1)+6.4,SFX.jingle);
  // 3 luxey
  at(s0(2),w=>bed(w,10,{type:'bandpass',f:600,q:.5,vol:.03,att:2,rel:2}));
  for(let x=.6;x<9.4;x+=60/110)at(s0(2)+x,SFX.kickFar);
  for(let x=2;x<9.6;x+=.5+R()*.9)at(s0(2)+x,SFX.cricket);
  // 4 étretat
  at(s0(3),w=>bed(w,5.8,{buf:BROWN,f:180,vol:.05,att:.8,rel:1.6}));
  at(s0(3)+2.6,w=>bed(w,7.6,{f:520,vol:.05,att:2,rel:2,lfo:.12,depth:.45}));
  at(s0(3)+2.6,w=>bed(w,7.6,{type:'highpass',f:2500,vol:.012,att:2,rel:2,lfo:.12,depth:.45}));
  at(s0(3)+6.6,SFX.gull);
  // 5 concert
  const bt=60/128;
  for(let x=.3,n=0;x<9.4;x+=bt,n++){at(s0(4)+x,SFX.kick);if(n%2===1)at(s0(4)+x,SFX.snare);}
  at(s0(4),w=>bed(w,10,{type:'bandpass',f:800,q:.5,vol:.035,att:1.5,rel:1.6}));
  for(let x=.3,n=0;x<9.4;x+=bt*2,n++){const m=x<5?35:31;at(s0(4)+x,w=>{const lp=filt('lowpass',260);const g=AC.createGain();env(g,w,.06,.01,bt*1.6,.2);const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=mf(m);o.connect(lp);lp.connect(g);toOut(g,.1);o.start(w);o.stop(w+bt*2.1);});}
  // 6 dax
  for(let x=.3;x<6.2;x+=.5)at(s0(5)+x,SFX.step);for(let x=.55;x<6.3;x+=.53)at(s0(5)+x,SFX.step);
  at(s0(5),w=>bed(w,10,{type:'bandpass',f:450,q:.5,vol:.018,att:2,rel:2}));
  at(s0(5),w=>bed(w,10,{type:'bandpass',f:2400,q:1.2,vol:.012,att:2,rel:2,lfo:3.3,depth:.3}));
  for(const x of[2.2,5.1,7.9])at(s0(5)+x,SFX.chirp);
  // 7 inondation
  at(s0(6),w=>bed(w,10,{type:'bandpass',f:3200,q:.4,vol:.045,att:1.4,rel:1.6}));
  at(s0(6),w=>bed(w,10,{f:350,vol:.035,att:1.4,rel:1.6,lfo:.2,depth:.3}));
  for(let x=.3;x<9.6;x+=.12+R()*.3)at(s0(6)+x,SFX.drip);
  // 8 maison
  for(let x=.5;x<9.5;x+=.8+R()*1.4)at(s0(7)+x,SFX.chirp);
  at(s0(7),w=>bed(w,10,{type:'bandpass',f:700,q:.4,vol:.018,att:2,rel:2,lfo:.15,depth:.5}));
  at(s0(7)+2.5,SFX.jingle);
  // 9 pedro
  for(let x=.3;x<5.4;x+=.22)at(s0(8)+x,SFX.gravel);
  for(let x=.5;x<8;x+=.45+R()*.7)at(s0(8)+x,SFX.tag);
  for(let x=1;x<9.5;x+=1.2+R()*1.5)at(s0(8)+x,SFX.chirp);
  // 10 naissance
  for(let x=.6;x<9.4;x+=1)at(s0(9)+x,SFX.heart);
  at(s0(9),w=>bed(w,10,{f:300,vol:.01,att:2,rel:2}));
  // 11 martinique
  at(s0(10),w=>{const s=nsrc(w,4.8,BROWN),b=filt('lowpass',400),g=AC.createGain();b.frequency.setValueAtTime(420,w);b.frequency.linearRampToValueAtTime(180,w+4.6);env(g,w,.04,1.8,1,2);s.connect(b);b.connect(g);toOut(g,.3);});
  at(s0(10)+1.4,w=>bed(w,16.5,{f:520,vol:.05,att:2.5,rel:3,lfo:.11,depth:.45}));
  at(s0(10)+1.4,w=>bed(w,16.5,{type:'highpass',f:2600,vol:.012,att:2.5,rel:3,lfo:.11,depth:.45}));
  at(s0(10),w=>bed(w,13,{type:'bandpass',f:900,q:.4,vol:.012,att:3,rel:3,lfo:.08,depth:.5}));
  for(let x=5;x<16;x+=.35+R()*.8)at(s0(10)+x,SFX.frog);
  E.sort((a,b)=>a.t-b.t);return E;
}
function schedule(ft){
  if(!AC)return;
  while(ei<EV.length&&EV[ei].t<ft+.8){const e=EV[ei++],w=T0+e.t;if(w>=AC.currentTime-.05){try{e.f(Math.max(w,AC.currentTime+.01));}catch(err){}}}
}

/* ============ lecture ============ */
const stage=document.getElementById('stage'),intro=document.getElementById('intro'),playBtn=document.getElementById('play'),replayBtn=document.getElementById('replay'),barI=document.querySelector('#bar i'),pauseEl=document.getElementById('pause');
let playing=false,paused=false,ended=false,P0=0,pausedAt=0;
let useAudioClock=false;
function now(){return useAudioClock?AC.currentTime-T0:(paused?pausedAt:(performance.now()-P0)/1000);}
async function start(){
  audioInit();
  useAudioClock=false;
  if(AC){try{await AC.resume();}catch(e){}if(AC.state==='running'){useAudioClock=true;audioChain();T0=AC.currentTime+.15;}}
  P0=performance.now()+150;EV=AC?buildEvents():[];ei=0;
  playing=true;paused=false;ended=false;replayBtn.classList.remove('on');pauseEl.classList.remove('on');
  intro.classList.add('fade');
}
playBtn.addEventListener('click',e=>{e.stopPropagation();start();});
replayBtn.addEventListener('click',e=>{e.stopPropagation();start();});
stage.addEventListener('click',async()=>{
  if(!playing||ended)return;
  if(!paused){paused=true;pausedAt=now();if(useAudioClock)try{await AC.suspend();}catch(e){}pauseEl.classList.add('on');}
  else{if(useAudioClock)try{await AC.resume();}catch(e){}else P0=performance.now()-pausedAt*1000;paused=false;pauseEl.classList.remove('on');}
});
function loop(){
  if(playing&&!paused){
    const ft=Math.max(0,now());
    if(useAudioClock)schedule(ft);
    render(Math.min(ft,TOTAL));
    barI.style.width=(clamp(ft/TOTAL)*100)+'%';
    if(ft>=TOTAL&&!ended){ended=true;replayBtn.classList.add('on');}
  }
  requestAnimationFrame(loop);
}
window.addEventListener('resize',resize);
resize();requestAnimationFrame(loop);
window.__renderAt=t=>render(t);
